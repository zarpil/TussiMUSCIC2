version: "3.8"

services:
  # 1. Base de datos MongoDB (Interna, sin colisiones de host)
  mongodb:
    image: mongo:7.0
    container_name: tussi-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - tussi-network

  # 2. Servidor de Audio NodeLink (Docker Hub oficial)
  nodelink:
    image: performanc/nodelink:latest
    container_name: tussi-nodelink
    restart: unless-stopped
    environment:
      - NODELINK_SERVER_HOST=0.0.0.0
      - NODELINK_SERVER_PORT=2333
      - NODELINK_SERVER_PASSWORD=youshallnotpass
      - NODELINK_PASSWORD=youshallnotpass
    volumes:
      - ./nodelink-config.js:/app/config.js
    networks:
      - tussi-network

  # 3. Bot de Discord + API Server & WebSockets
  bot:
    build:
      context: ./aurora-bot/aurora-bot
      dockerfile: Dockerfile
    container_name: tussi-bot
    restart: unless-stopped
    ports:
      - "2729:3001"
    env_file:
      - ./aurora-bot/aurora-bot/.env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/tussimusic}
      - BACKEND_PORT=3001
      - WEB_DASHBOARD_URL=${WEB_DASHBOARD_URL:-https://tussi.zarpil.dev}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://tussi.zarpil.dev}
      - NODELINK_HOST=nodelink
      - NODELINK_PORT=2333
      - NODELINK_PASSWORD=youshallnotpass
      - NODELINK_SERVER_PASSWORD=youshallnotpass
    depends_on:
      - mongodb
      - nodelink
    volumes:
      - bot_logs:/app/logs
    networks:
      - tussi-network

  # 4. Frontend Web Dashboard (Next.js)
  web:
    build:
      context: ./aurora-web/aurora-web
      dockerfile: Dockerfile
    container_name: tussi-web
    restart: unless-stopped
    ports:
      - "2728:3000"
    env_file:
      - ./aurora-web/aurora-web/.env.local
    environment:
      - INTERNAL_API_URL=http://bot:3001
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/tussimusic}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-https://tussi.zarpil.dev}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://tussi.zarpil.dev}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://tussi.zarpil.dev}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-https://tussi.zarpil.dev/api/auth/discord/callback}
    depends_on:
      - bot
      - mongodb
    networks:
      - tussi-network

networks:
  tussi-network:
    name: tussi-network
    driver: bridge

volumes:
  mongodb_data:
  bot_logs:
